name: Delete branches

# One-off housekeeping, run by hand from a throwaway branch. Deletes the
# branches named in the input (including the branch this file lives on).
on:
  workflow_dispatch:
    inputs:
      branches:
        description: Space-separated branch names to delete
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete branches
        run: |
          for b in ${{ inputs.branches }}; do
            git push origin --delete "$b" && echo "deleted $b"
          done
